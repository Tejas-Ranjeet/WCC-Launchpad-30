services:
  - type: web
    name: airguard-agent
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python scripts/seed_demo.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: LLM_PROVIDER
        value: MOCK
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
